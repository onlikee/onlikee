#basic
spring.application.name=onlikee-backend
spring.threads.virtual.enabled=true

#file upload
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
server.tomcat.max-swallow-size=210MB

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/onlikee?connectTimeout=5&socketTimeout=5&options=-c%20TimeZone%3DAsia%2FShanghai
spring.datasource.username=your_postgresql_username
spring.datasource.password=your_postgresql_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=your_redis_password
spring.data.redis.database=0
spring.data.redis.timeout=5s

#mybatis
#配置下划线转驼峰
mybatis.configuration.map-underscore-to-camel-case=true

#GitHub oauth
github.oauth.client-id=your_github_client_id
github.oauth.client-secret=your_github_client_secret
github.oauth.redirect-uri=http://localhost:5173/auth/login

#Gitee oauth
gitee.oauth.client-id=your_gitee_client_id
gitee.oauth.client-secret=your_gitee_client_secret
gitee.oauth.redirect-uri=http://localhost:5173/auth/login

#JWT
security.jwt.secret=replace_with_at_least_32_characters_secret
security.jwt.expire-seconds=604800

#Light OSS
light-oss.api-base-url=http://localhost:8081
light-oss.bearer-token=your_light_oss_bearer_token

#Application
app.domain-suffix=.example.com
